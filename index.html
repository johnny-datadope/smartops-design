    display: flex; align-items: center; justify-content: center;
  }
  .reasoning-step__dot--active { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; color: var(--primary); }
  .reasoning-step__dot--done {
    width: 0.75rem; height: 0.75rem; border-radius: 9999px;
    background: color-mix(in oklch, var(--primary) 20%, transparent);
    display: flex; align-items: center; justify-content: center; color: var(--primary);
  }
  .reasoning-step__dot--pending { width: 0.5rem; height: 0.5rem; border-radius: 9999px; background: color-mix(in oklch, var(--muted-foreground) 30%, transparent); }
  .reasoning-step__label {
    margin: 0; font-size: 11.5px; font-weight: 500; line-height: 1.3;
    overflow-wrap: anywhere; color: var(--muted-foreground);
  }
  .reasoning-step__label.is-active { color: var(--foreground); }
  .reasoning-step__tools { margin-top: 0.375rem; display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; }
  .reasoning-tool {
    margin-left: 1rem; min-width: 0; overflow: hidden;
    border-radius: 0.375rem; border: 1px solid color-mix(in oklch, var(--border) 60%, transparent);
    background: color-mix(in oklch, var(--card) 80%, transparent);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }
  .reasoning-tool__head {
    display: flex; width: 100%; align-items: center; gap: 0.5rem;
    padding: 0.375rem 0.625rem; text-align: left; border: 0; background: color-mix(in oklch, var(--muted) 20%, transparent);
    font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 10.5px; line-height: 1.625; color: inherit; cursor: pointer;
  }
  .reasoning-tool__head:disabled { cursor: default; background: color-mix(in oklch, var(--muted) 10%, transparent); }
  .reasoning-tool__head:not(:disabled):hover { background: color-mix(in oklch, var(--muted) 40%, transparent); }
  .reasoning-tool__prompt { flex-shrink: 0; color: color-mix(in oklch, var(--primary) 70%, transparent); }
  .reasoning-tool__badge {
    flex-shrink: 0; border-radius: 0.25rem; padding: 0.125rem 0.375rem; font-weight: 600; font-size: 10px;
    background: color-mix(in oklch, var(--primary) 10%, transparent); color: var(--primary);
    border: 1px solid color-mix(in oklch, var(--primary) 20%, transparent);
  }
  .reasoning-tool__cmd-preview { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted-foreground); }
  .reasoning-tool__body { border-top: 1px solid color-mix(in oklch, var(--border) 50%, transparent); background: color-mix(in oklch, var(--muted) 10%, transparent); }
  .reasoning-tool__section-head {
    display: flex; align-items: center; gap: 0.375rem; padding: 0.375rem 0.625rem;
    font-size: 10px; font-weight: 600; color: var(--muted-foreground);
  }
  .reasoning-tool__query {
    padding: 0 0.625rem 0.625rem; font-family: 'Roboto Mono', ui-monospace, monospace;
    font-size: 10.5px; line-height: 1.625; white-space: pre-wrap; word-break: break-word;
    background: color-mix(in oklch, var(--muted) 20%, transparent);
    border-bottom: 1px solid color-mix(in oklch, var(--border) 50%, transparent);
  }
  /* Terminal query tokens — Apolo reasoning-display.tsx (dark-mode palette) */
  .terminal-token--key { color: #34d399; }           /* emerald-400 — JSON keys */
  .terminal-token--string { color: #6ee7b7; }       /* emerald-300 — string values */
  .terminal-token--number { color: #fbbf24; }       /* amber-400 — numeric literals */
  .terminal-token--keyword { color: #38bdf8; }      /* sky-400 — Python keywords */
  .terminal-token--assign-key { color: #38bdf8; }   /* sky-400 — key=value keys */
  .terminal-token--flag { color: #a78bfa; }         /* violet-400 — CLI flags */
  .terminal-token--punct { color: color-mix(in oklch, var(--muted-foreground) 60%, transparent); }
  .terminal-token--plain { color: color-mix(in oklch, var(--foreground) 85%, transparent); }
  [data-theme="light"] .terminal-token--key { color: #059669; }       /* emerald-600 */
  [data-theme="light"] .terminal-token--string { color: #10b981; }    /* emerald-500 */
  [data-theme="light"] .terminal-token--number { color: #d97706; }    /* amber-600 */
  [data-theme="light"] .terminal-token--keyword { color: #0284c7; }   /* sky-600 */
  [data-theme="light"] .terminal-token--assign-key { color: #0284c7; }
  [data-theme="light"] .terminal-token--flag { color: #7c3aed; }      /* violet-600 */
  .reasoning-tool__output {
    margin: 0; padding: 0 0.625rem 0.625rem; max-height: 300px; overflow: auto;
    font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 10.5px; line-height: 1.625;
    white-space: pre-wrap; word-break: break-all; color: color-mix(in oklch, var(--foreground) 80%, transparent);
  }
  /* Case management header — Chia case-management.tsx */
  .case-mgmt {
    padding: 0.75rem 1rem; border-bottom: 1px solid var(--border);
    background: color-mix(in oklch, var(--card) 80%, var(--background));
    flex-shrink: 0; display: flex; flex-direction: column; gap: 12px;
  }
  .case-mgmt__top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .case-mgmt__top--mobile {
    align-items: center;
  }
  .case-mgmt__top-aside {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.375rem;
    flex-shrink: 0;
  }
  .case-mgmt__assignees--mobile {
    flex-wrap: nowrap;
    align-items: center;
  }
  .case-mgmt__assignees--mobile .case-mgmt__assignee-list {
    flex: 1;
    min-width: 0;
  }
  .case-mgmt__assignee-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
    margin-left: auto;
  }
  .case-mgmt__title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .case-mgmt__actions-wrap { position: relative; flex-shrink: 0; }
  .case-mgmt__title-icon {
    width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
    background: color-mix(in oklch, var(--primary) 15%, transparent);
    color: var(--primary); display: flex; align-items: center; justify-content: center;
  }
  .case-mgmt__title-text { font-size: 0.875rem; font-weight: 600; color: var(--foreground); }
  .case-mgmt__assignees { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .case-mgmt__users-icon { flex-shrink: 0; color: var(--muted-foreground); margin-top: 2px; }
  .case-mgmt__assignee-list { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .case-mgmt__unassigned { font-size: 11px; color: var(--muted-foreground); }
  .case-assign-popover,
  .assignee-popover {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 50;
    width: 15rem; padding: 0.5rem;
    background: var(--popover, var(--card)); color: var(--popover-foreground, var(--foreground));
    border: 1px solid var(--border); border-radius: 0.375rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -2px rgba(0, 0, 0, 0.15);
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* Apolo AssigneeSelector — search + checkbox rows */
  .assignee-selector {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    min-width: 0;
  }
  .assignee-selector__search-wrap {
    position: relative;
    margin-bottom: 0.25rem;
  }
  .assignee-selector__search-icon {
    position: absolute;
    left: 0.5rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    color: var(--muted-foreground);
    pointer-events: none;
  }
  .assignee-selector__search-input {
    width: 100%;
    height: 2rem;
    padding: 0 0.625rem 0 1.75rem;
    font-size: 0.875rem;
    font-family: inherit;
    color: var(--foreground);
    background: var(--background);
    border: 1px solid var(--input, var(--border));
    border-radius: 0.375rem;
    outline: none;
    box-sizing: border-box;
  }
  .assignee-selector__search-input:focus {
    border-color: var(--ring, var(--primary));
    box-shadow: 0 0 0 2px color-mix(in oklch, var(--primary) 25%, transparent);
  }
  .assignee-selector__list {
    max-height: 14rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .assignee-selector__row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.375rem 0.5rem;
    border-radius: 0.125rem;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .assignee-selector__row:hover:not(.is-disabled) {
    background: var(--accent);
    color: var(--accent-foreground);
  }
  .assignee-selector__row.is-disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .assignee-selector__checkbox {
    width: 1rem;
    height: 1rem;
    flex-shrink: 0;
    border-radius: 4px;
    border: 1px solid var(--input, var(--border));
    background: transparent;
    box-shadow: var(--shadow-xs);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-foreground);
    transition: box-shadow 0.15s, background 0.15s, border-color 0.15s;
  }
  [data-theme="dark"] .assignee-selector__checkbox:not(.is-checked) {
    background: color-mix(in oklch, var(--input) 30%, transparent);
  }
  .assignee-selector__checkbox.is-checked {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-foreground);
  }
  .assignee-selector__label {
    font-size: 0.875rem;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .assignee-selector__divider {
    height: 1px;
    background: var(--border);
    margin: 0.25rem 0;
  }
  .assignee-selector__empty {
    padding: 0.375rem 0.5rem;
    font-size: 0.875rem;
    color: var(--muted-foreground);
  }

  /* Case actions dropdown — Chia DropdownMenuContent / DropdownMenuItem */
  .case-actions-btn {
    display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px;
    font-size: 11px; font-weight: 500; color: var(--foreground);
    background: var(--background); border: 1px solid var(--border); border-radius: 0.375rem;
    box-shadow: var(--shadow-xs); cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .case-actions-btn:hover:not(:disabled) {
    background: var(--accent); color: var(--accent-foreground);
  }
  .dropdown-menu {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 2;
    min-width: 8rem; width: max-content; padding: 4px;
    background: var(--popover, var(--card)); color: var(--popover-foreground, var(--foreground));
    border: 1px solid var(--border); border-radius: 0.375rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -2px rgba(0, 0, 0, 0.15);
  }
  .dropdown-menu__item {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border: 0; border-radius: 0.25rem;
    font-size: 0.875rem; line-height: 1.25rem; font-family: inherit;
    color: var(--popover-foreground, var(--foreground));
    background: transparent; cursor: pointer; text-align: left;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .dropdown-menu__item:hover,
  .dropdown-menu__item:focus-visible {
    background: var(--accent); color: var(--accent-foreground); outline: none;
  }
  .dropdown-menu__item:hover .dropdown-menu__item-icon,
  .dropdown-menu__item:focus-visible .dropdown-menu__item-icon {
    color: var(--primary);
  }
  .dropdown-menu__item-icon {
    display: inline-flex; flex-shrink: 0; color: var(--primary);
  }
  .dropdown-menu__item-label {
    white-space: nowrap;
  }

  .activity-timeline { display: flex; flex-direction: column; gap: 0; }
  .activity-timeline__item { display: flex; gap: 12px; }
  .activity-timeline__rail { display: flex; flex-direction: column; align-items: center; width: 12px; flex-shrink: 0; padding-top: 4px; }
  .activity-timeline__dot { width: 8px; height: 8px; border-radius: 9999px; background: var(--primary); flex-shrink: 0; }
  .activity-timeline__line { width: 2px; flex: 1; min-height: 16px; background: var(--border); margin: 4px 0; border-radius: 9999px; }
  .activity-timeline__body { flex: 1; padding-bottom: 16px; min-width: 0; }
  .activity-timeline__meta {
    display: flex; gap: 8px;
    font-size: var(--type-2sm); font-weight: var(--weight-medium);
    color: var(--muted-foreground); margin-bottom: 4px;
  }
  .activity-timeline__text { font-size: var(--type-md); line-height: var(--leading-relaxed); }

  .json-payload-card { border: 1px solid var(--border); border-radius: 0.5rem; overflow: hidden; background: var(--card); }
  .json-payload-card__header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .json-payload-card__header-main { display: flex; align-items: center; gap: 8px; }
  .json-payload-card__title { font-size: var(--type-md); font-weight: var(--weight-semibold); }
  .json-payload-card__icon {
    width: 24px; height: 24px; border-radius: 6px;
    background: color-mix(in oklch, var(--primary) 10%, transparent);
    color: var(--primary); display: flex; align-items: center; justify-content: center;
  }
  .json-payload-card__body {
    margin: 0; padding: 16px; max-height: 400px; overflow: auto;
    font-size: var(--type-sm); line-height: var(--leading-relaxed);
    white-space: pre-wrap; word-break: break-all;
  }

  /* Chia case-management assignee pill */
  .assignee-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 6px 2px 2px; border-radius: 9999px;
    border: 1px solid var(--border);
    background: color-mix(in oklch, var(--secondary) 50%, transparent);
  }
  .assignee-chip__avatar {
    width: 16px; height: 16px; border-radius: 9999px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700; color: var(--foreground);
    background: color-mix(in oklch, var(--card) 90%, var(--secondary));
  }
  .assignee-chip__name { font-size: 11px; color: var(--foreground); line-height: 1.2; }
  .assignee-chip__remove {
    display: inline-flex; padding: 2px; border: 0; background: transparent;
    color: var(--muted-foreground); cursor: pointer; border-radius: 9999px;
    transition: background 0.15s, color 0.15s;
  }
  .assignee-chip__remove:hover {
    background: color-mix(in oklch, var(--destructive) 20%, transparent);
    color: var(--destructive);
  }
  /* Chia Button outline sm + border-dashed */
  .assign-to-btn {
    display: inline-flex; align-items: center; gap: 4px;
    height: 24px; padding: 0 8px; border-radius: 0.375rem;
    font-size: 11px; font-weight: 500; color: var(--foreground);
    background: var(--background); border: 1px dashed var(--border);
    box-shadow: var(--shadow-xs); cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .assign-to-btn:hover { background: var(--accent); color: var(--accent-foreground); }

  /* Case comments — mirrors chia CaseCommentsSection + PersonAvatar */
  .case-comments {
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--card);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-width: 0;
    width: 100%;
  }
  .case-comments__header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
  }
  .case-comments__icon {
    width: 1.5rem;
    height: 1.5rem;
    border-radius: var(--radius-sm);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in oklch, var(--primary) 15%, transparent);
    color: var(--primary);
  }
  .case-comments__title {
    font-size: 0.875rem;
    font-weight: 600;
    margin: 0;
    color: var(--foreground);
  }
  .case-comments__count {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted-foreground);
    flex-shrink: 0;
  }
  .case-comments__content {
    margin-left: 2rem;
    min-width: 0;
  }
  .case-comments__list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-width: 0;
    margin-bottom: 0.625rem;
  }
  .case-comment {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 0.75rem;
    align-items: start;
    min-width: 0;
  }
  .case-comment__avatar {
    width: 1.75rem;
    height: 1.75rem;
    border-radius: 9999px;
    flex-shrink: 0;
    margin-top: 0.125rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(to bottom right, #14b8a6, #2563eb);
  }
  .case-comment__body { min-width: 0; }
  .case-comment__meta {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    column-gap: 0.5rem;
    row-gap: 0.125rem;
  }
  .case-comment__author {
    font-size: 13px;
    font-weight: 600;
    color: var(--foreground);
  }
  .case-comment__date {
    font-size: 10px;
    color: var(--muted-foreground);
    flex-shrink: 0;
  }
  .case-comment__text {
    font-size: 13px;
    line-height: 1.625;
    margin: 0.125rem 0 0;
    color: var(--secondary-foreground);
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  /* Comment composer — mirrors chia CaseCommentsSection textarea + ScrollArea */
  .case-comments__composer {
    padding-top: 0.5rem;
    border-top: 1px solid var(--border);
  }
  .comment-composer {
    display: flex;
    align-items: flex-end;
    gap: 0.5rem;
    min-width: 0;
    padding: 0.625rem 0.875rem;
    border-radius: 0.75rem;
    border: 1px solid var(--border);
    background: color-mix(in oklch, var(--muted) 60%, transparent);
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .comment-composer:focus-within {
    box-shadow: 0 0 0 1px color-mix(in oklch, var(--primary) 40%, transparent);
    border-color: color-mix(in oklch, var(--primary) 30%, transparent);
  }
  .comment-composer__scroll {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    position: relative;
  }
  .comment-composer__scroll-viewport {
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    outline: none;
  }
  .comment-composer__textarea {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    display: block;
    margin: 0;
    background: transparent;
    border: 0;
    resize: none;
    outline: none;
    min-height: 20px;
    font-size: 13px;
    line-height: 1.625;
    color: var(--foreground);
    padding: 0 1.5rem 0 0;
    overflow-wrap: anywhere;
    word-break: break-word;
    font-family: inherit;
  }
  .comment-composer__textarea::placeholder { color: var(--muted-foreground); }
  .comment-composer__send {
    width: 1.75rem;
    height: 1.75rem;
    flex-shrink: 0;
    border-radius: 0.5rem;
    border: 0;
    padding: 0;
    background: var(--primary);
    color: var(--primary-foreground);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .comment-composer__send:hover:not(:disabled) {
    background: color-mix(in oklch, var(--primary) 90%, transparent);
  }
  .comment-composer__send:disabled { opacity: 0.3; cursor: default; }
  .comment-counter {
    margin: 0.25rem 0 0;
    font-size: 10px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .comment-counter.is-over-limit { color: var(--destructive); }
  .comment-counter:not(.is-over-limit) { color: var(--muted-foreground); }

  .label-chip { font-family: var(--font-mono, monospace); font-size: 0.6875rem; }

  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes slideIn { from { transform:translateX(100%); } to { transform:none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge-icon { width: 0.75rem; height: 0.75rem; flex-shrink: 0; }
  .badge-icon--spin { animation: spin 1s linear infinite; }

  /* Admin sidebar — hidden on mobile like Apolo (hidden md:block) */
  .admin-sidebar { display: flex; }
  @media (max-width: 767.98px) { .admin-sidebar { display: none; } }
  /* Admin usage — KPI grid (Apolo: grid-cols-1 md:grid-cols-3 gap-4) */
  /* Admin usage — period tabs (Apolo PeriodFilter) */
  .usage-period-tabs {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.25rem;
    padding: 0.25rem;
    border-radius: 0.5rem;
    border: 1px solid var(--border);
    background: color-mix(in oklch, var(--background) 60%, transparent);
  }
  .usage-period-tab {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    height: 2rem;
    padding: 0 0.75rem;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted-foreground);
    font-size: 0.875rem;
    font-weight: 500;
    font-family: inherit;
    line-height: 1.25rem;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }
  .usage-period-tab:hover {
    background: var(--accent);
    color: var(--accent-foreground);
  }
  .usage-period-tab.is-active {
    background: var(--accent);
    color: var(--accent-foreground);
  }
  .usage-period-tab:focus-visible {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
  }
  .usage-period-tab svg {
    flex-shrink: 0;
    width: 1rem;
    height: 1rem;
    pointer-events: none;
  }

  .usage-period-filter {
    position: relative;
    display: inline-flex;
  }

  /* Custom range popover — Apolo PopoverContent (w-auto p-0) + footer p-3 */
  .usage-period-popover {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    z-index: 50;
    width: auto;
    padding: 0;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--popover);
    color: var(--popover-foreground);
    box-shadow: var(--shadow-xs), 0 10px 15px -3px rgba(0, 0, 0, 0.35), 0 4px 6px -4px rgba(0, 0, 0, 0.25);
  }
  .usage-period-popover__footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    min-height: 3.25rem;
    border-top: 1px solid var(--border);
    padding: 0.75rem;
  }
  .usage-period-popover__hint {
    flex: 1;
    min-width: 0;
    font-size: 0.75rem;
    line-height: 1.25rem;
    color: var(--muted-foreground);
    user-select: none;
  }
  .usage-period-popover__apply {
    flex-shrink: 0;
    font-weight: 500;
  }

  /* react-day-picker v9 — Apolo ui/calendar.tsx (--cell-size: 2rem, gap-4, md:flex-row) */
  .usage-rdp-calendar {
    --usage-rdp-cell: 2rem;
    padding: 0.75rem;
    background: transparent;
    user-select: none;
  }
  .usage-rdp-calendar__months {
    position: relative;
    width: fit-content;
  }
  .usage-rdp-calendar__grid {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 1rem;
  }
  @media (max-width: 767.98px) {
    .usage-period-popover {
      right: auto;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 1.5rem);
    }
    .usage-rdp-calendar__grid {
      flex-direction: column;
    }
  }
  .usage-rdp-calendar__nav {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--usage-rdp-cell);
    pointer-events: none;
  }
  .usage-rdp-nav-btn {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: var(--usage-rdp-cell);
    height: var(--usage-rdp-cell);
    padding: 0;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--foreground);
    cursor: pointer;
    flex-shrink: 0;
  }
  .usage-rdp-nav-btn:hover {
    background: var(--accent);
    color: var(--accent-foreground);
  }
  .usage-rdp-nav-btn:focus-visible {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
    outline: none;
  }
  .usage-rdp-month {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: calc(7 * var(--usage-rdp-cell));
    flex: 0 0 auto;
  }
  .usage-rdp-month__caption {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: var(--usage-rdp-cell);
    padding: 0 var(--usage-rdp-cell);
    box-sizing: border-box;
  }
  .usage-rdp-month__caption-label {
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 1;
    color: var(--foreground);
    white-space: nowrap;
  }
  .usage-rdp-weekdays {
    display: flex;
    width: calc(7 * var(--usage-rdp-cell));
  }
  .usage-rdp-weekday {
    width: var(--usage-rdp-cell);
    flex: 0 0 var(--usage-rdp-cell);
    text-align: center;
    font-size: 0.8rem;
    font-weight: 400;
    line-height: var(--usage-rdp-cell);
    color: var(--muted-foreground);
  }
  .usage-rdp-weeks {
    display: flex;
    flex-direction: column;
    width: calc(7 * var(--usage-rdp-cell));
  }
  .usage-rdp-week {
    display: flex;
    width: calc(7 * var(--usage-rdp-cell));
  }
  .usage-rdp-week--offset {
    margin-top: 0.5rem;
  }
  .usage-rdp-day {
    position: relative;
    width: var(--usage-rdp-cell);
    height: var(--usage-rdp-cell);
    flex: 0 0 var(--usage-rdp-cell);
    padding: 0;
    text-align: center;
  }
  .usage-rdp-day button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: none;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--foreground);
    font-size: 0.75rem;
    font-weight: 400;
    font-family: inherit;
    line-height: 1;
    cursor: pointer;
  }
  .usage-rdp-day.is-outside button {
    color: var(--muted-foreground);
  }
  .usage-rdp-day.is-disabled button {
    color: var(--muted-foreground);
    opacity: 0.5;
    cursor: not-allowed;
    pointer-events: none;
  }
  .usage-rdp-day:not(.is-disabled):not(.is-selected):not(.is-range-start):not(.is-range-end):not(.is-range-middle) button:hover {
    background: var(--accent);
    color: var(--accent-foreground);
  }
  /* Today — Apolo .today */
  .usage-rdp-day.is-today:not(.is-selected):not(.is-range-start):not(.is-range-end):not(.is-range-middle) button {
    background: var(--accent);
    color: var(--accent-foreground);
    border-radius: var(--radius-sm);
  }
  /* Range track on cell — Apolo .range_start / .range_middle / .range_end */
  .usage-rdp-day.is-range-start,
  .usage-rdp-day.is-range-end {
    background: var(--accent);
  }
  .usage-rdp-day.is-range-start {
    border-radius: var(--radius-sm) 0 0 var(--radius-sm);
  }
  .usage-rdp-day.is-range-end {
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  .usage-rdp-day.is-range-middle {
    background: var(--accent);
    border-radius: 0;
  }
  /* Day button — Apolo CalendarDayButton */
  .usage-rdp-day.is-selected button,
  .usage-rdp-day.is-range-start button,
  .usage-rdp-day.is-range-end button {
    background: var(--primary);
    color: var(--primary-foreground);
  }
  .usage-rdp-day.is-selected button {
    border-radius: var(--radius-sm);
  }
  .usage-rdp-day.is-range-start button {
    border-radius: var(--radius-sm) 0 0 var(--radius-sm);
  }
  .usage-rdp-day.is-range-end button {
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  .usage-rdp-day.is-range-middle button {
    background: var(--accent);
    color: var(--accent-foreground);
    border-radius: 0;
  }
  .usage-rdp-day.is-today.is-selected button,
  .usage-rdp-day.is-today.is-range-start button,
  .usage-rdp-day.is-today.is-range-end button {
    background: var(--primary);
    color: var(--primary-foreground);
  }

  .usage-kpi-grid {
    display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 1rem;
  }
  @media (min-width: 768px) { .usage-kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  /* Admin usage — chart + top-consumers (Apolo usage-cost-reports-page: gap-6, xl side panel) */
  .usage-chart-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 1.5rem;
    align-items: stretch;
  }
  @media (min-width: 1280px) {
    .usage-chart-grid {
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
    }
  }

  /* Desglose diario — Apolo daily-breakdown-chart.tsx */
  .usage-daily-breakdown.card {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding: 1.25rem;
    height: 100%;
    min-height: 0;
  }
  .usage-daily-breakdown__head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }
  .usage-daily-breakdown__title {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.25;
  }
  .usage-daily-breakdown__subtitle {
    margin: 0.125rem 0 0;
    font-size: 0.75rem;
    line-height: 1.25;
    color: var(--muted-foreground);
  }
  .usage-daily-breakdown__legend {
    display: none;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.75rem;
    color: var(--muted-foreground);
  }
  @media (min-width: 640px) {
    .usage-daily-breakdown__legend { display: flex; }
  }
  .usage-daily-breakdown__legend-item {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
  }
  .usage-daily-breakdown__legend-mark {
    flex-shrink: 0;
    width: 0.625rem;
    height: 0.625rem;
    border-radius: 0.125rem;
  }
  .usage-daily-breakdown__legend-mark.is-line {
    width: 1rem;
    height: 0.125rem;
    border-radius: 9999px;
  }
  .usage-daily-breakdown__chart-wrap {
    height: 280px;
    width: 100%;
    color: var(--muted-foreground);
  }
  .usage-daily-breakdown__empty {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: center;
    min-height: 280px;
    padding: 3rem 1.5rem;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    background: color-mix(in oklch, var(--background) 40%, transparent);
  }
  .usage-daily-breakdown__empty-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    max-width: 24rem;
  }
  .usage-daily-breakdown__empty-icon {
    color: var(--muted-foreground);
  }
  .usage-daily-breakdown__empty-title {
    margin: 0;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--foreground);
  }
  .usage-daily-breakdown__empty-desc {
    margin: 0;
    font-size: 0.75rem;
    line-height: 1.5;
    color: var(--muted-foreground);
  }
  /* Recharts positions the wrapper; inner box matches Apolo ChartTooltip */
  .usage-chart-tooltip {
    max-width: 260px;
    padding: 0.5rem 0.75rem;
    font-size: 0.75rem;
    line-height: 1.25;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: color-mix(in oklch, var(--background) 95%, transparent);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.35), 0 4px 6px -4px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(8px);
  }
  .recharts-tooltip-wrapper {
    z-index: 5;
    outline: none;
  }
  .usage-chart-tooltip__label {
    margin-bottom: 0.25rem;
    font-weight: 500;
    color: var(--foreground);
  }
  .usage-chart-tooltip__row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .usage-chart-tooltip__row span:last-child {
    margin-left: auto;
    font-family: var(--font-mono, 'Roboto Mono', monospace);
    font-variant-numeric: tabular-nums;
  }
  .usage-chart-tooltip__muted {
    color: var(--muted-foreground);
  }
  .usage-chart-tooltip__note {
    margin: 0.375rem 0 0;
    padding-top: 0.375rem;
    border-top: 1px solid var(--border);
    line-height: 1.375;
    color: var(--muted-foreground);
  }
  /* Admin usage — header (Apolo: column on mobile, row on md) */
  .usage-header {
    display: flex; flex-direction: column; align-items: flex-start; gap: 16px;
  }
  @media (min-width: 768px) {
    .usage-header { flex-direction: row; align-items: flex-start; justify-content: space-between; gap: 20px; }
  }
  /* Top cases panel header — Apolo top-cases-panel.tsx */
  .usage-top-cases-header {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: color-mix(in oklch, var(--muted) 30%, transparent);
  }
  @media (min-width: 768px) {
    .usage-top-cases-header {
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
    }
  }
  .usage-top-cases-header__title {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.25;
  }
  .usage-top-cases-header__subtitle {
    margin: 0.125rem 0 0;
    font-size: 0.75rem;
    line-height: 1.25;
    color: var(--muted-foreground);
  }
  .usage-top-cases-header__summary {
    margin: 0;
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1.25;
    color: var(--muted-foreground);
    font-family: inherit;
  }
  @media (min-width: 768px) {
    .usage-top-cases-header__summary { text-align: right; flex-shrink: 0; }
  }
  /* Top cases event link — Apolo: truncate on cell, hover:underline on link (no overflow on <a>) */
  .usage-top-cases-event-cell {
    max-width: 28rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 1.25;
  }
  .usage-top-cases-event-link {
    color: var(--foreground);
    text-decoration: none;
    text-underline-offset: 4px;
    cursor: pointer;
  }
  .usage-top-cases-event-link:hover,
  .usage-top-cases-event-link:focus-visible {
    text-decoration-line: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 4px;
  }
  .usage-top-cases-event-text {
    color: var(--foreground);
  }

  /* Top consumidores — Apolo top-users-panel.tsx */
  .usage-top-users.card {
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
    padding-top: 0;
    padding-bottom: 0;
    min-height: 0;
    height: 100%;
  }
  .usage-panel-header {
    padding: 1rem;
    border-bottom: 1px solid var(--border);
    background: color-mix(in oklch, var(--muted) 30%, transparent);
  }
  .usage-panel-header__title {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.25;
  }
  .usage-panel-header__subtitle {
    margin: 0.125rem 0 0;
    font-size: 0.75rem;
    line-height: 1.25;
    color: var(--muted-foreground);
  }
  .usage-top-users-list {
    display: flex;
    flex-direction: column;
    padding: 0 1rem;
  }
  .usage-top-users-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 0;
  }
  .usage-top-users-row + .usage-top-users-row {
    border-top: 1px solid color-mix(in oklch, var(--border) 70%, transparent);
  }
  .usage-top-users-avatar {
    width: 2.25rem;
    height: 2.25rem;
    flex-shrink: 0;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    border: 1px solid color-mix(in srgb, #22d3ee 25%, transparent);
    background: color-mix(in srgb, #06b6d4 10%, transparent);
    color: #67e8f9;
  }
  .usage-top-users-body {
    min-width: 0;
    flex: 1;
  }
  .usage-top-users-name {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 1.25;
    color: var(--foreground);
  }
  .usage-top-users-meta {
    margin: 0.125rem 0 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.75rem;
    line-height: 1.25;
    color: var(--muted-foreground);
  }
  .usage-top-users-cost {
    text-align: right;
    flex-shrink: 0;
    font-family: var(--font-mono, 'Roboto Mono', monospace);
    font-size: 0.875rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--foreground);
  }
  .usage-top-users-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 2.5rem 1rem;
    text-align: center;
  }
  .usage-top-users-empty__icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    margin-bottom: 0.5rem;
    border-radius: var(--radius-sm);
    background: var(--muted);
    color: var(--foreground);
  }
  .usage-top-users-empty__title {
    margin: 0;
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.25;
    color: var(--foreground);
  }
  .usage-top-users-empty__desc {
    margin: 0;
    max-width: 20rem;
    font-size: 0.875rem;
    line-height: 1.5;
    color: var(--muted-foreground);
  }

  /* Admin users — header (Apolo: stacked on mobile, row on md, button full-width mobile) */
  .users-header {
    display: flex; flex-direction: column; gap: 1rem;
  }
  @media (min-width: 768px) {
    .users-header { flex-direction: row; align-items: flex-start; justify-content: space-between; }
  }
  .users-title { font-size: 1.5rem; font-weight: var(--weight-bold); margin: 0; }
  @media (min-width: 768px) { .users-title { font-size: 1.875rem; } }
  .users-subtitle { font-size: 0.875rem; margin-top: 0.25rem; color: var(--muted-foreground); }
  @media (min-width: 768px) { .users-subtitle { font-size: 1rem; } }
  .users-create-btn { width: 100%; }
  @media (min-width: 640px) { .users-create-btn { width: auto; align-self: flex-start; } }
  /* Admin users — stats grid (Apolo: grid-cols-1 sm:2 xl:4 gap-4) */
  .users-stats-grid {
    display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 1rem;
  }
  @media (min-width: 640px) { .users-stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1280px) { .users-stats-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .users-table__name { font-weight: var(--weight-medium); font-size: var(--type-md); }
  .users-stat-value { font-size: 1.5rem; font-weight: var(--weight-semibold); line-height: 1; }
  @media (min-width: 640px) { .users-stat-value { font-size: 1.875rem; } }
  /* Admin users — stat icon circle (Apolo: rounded-full bg tint, h-9 sm:h-10) */
  .users-stat-icon {
    width: 2.25rem; height: 2.25rem; border-radius: 9999px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .users-stat-icon svg { width: 1rem; height: 1rem; }
  @media (min-width: 640px) {
    .users-stat-icon { width: 2.5rem; height: 2.5rem; }
    .users-stat-icon svg { width: 1.25rem; height: 1.25rem; }
  }
  /* Admin users — table avatar fallback (Apolo: bg-muted, foreground, size-8) */
  .users-avatar {
    width: 2rem; height: 2rem; border-radius: 9999px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 600;
    background: var(--muted); color: var(--foreground);
  }
  /* Toggle switch (Apolo Radix Switch) */
  .switch-toggle {
    position: relative; width: 2.25rem; height: 1.25rem; flex-shrink: 0;
    border-radius: 9999px; border: 0; padding: 0; cursor: pointer;
    background: var(--input); transition: background 0.15s;
  }
  .switch-toggle[aria-checked="true"] { background: var(--primary); }
  .switch-toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 1rem; height: 1rem; border-radius: 9999px; background: #fff;
    transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .switch-toggle[aria-checked="true"]::after { transform: translateX(1rem); }

  /* Admin users table — row hover (Apolo: hover:bg-muted/50) */
  .users-table tbody tr:hover {
    background: color-mix(in oklch, var(--muted) 50%, transparent);
  }
  /* Admin users table — responsive columns (Apolo breakpoints:
     role/status sm·640, username md·768, email lg·1024, password xl·1280) */
  @media (min-width: 768px) {
    .admin-mobile-label { display: none !important; }
  }
  @media (max-width: 639.98px) {
    .users-col-username, .users-col-email, .users-col-password,
    .users-col-role, .users-col-status { display: none; }
    .users-table-mobile-meta, .users-table-mobile-email { display: block !important; }
    .users-table-mobile-badges { display: flex !important; }
    .users-btn-edit, .users-btn-remove { min-width: 2rem; padding: 0 0.5rem; }
  }
  @media (min-width: 640px) and (max-width: 767.98px) {
    .users-col-username, .users-col-email, .users-col-password { display: none; }
  }
  @media (min-width: 768px) and (max-width: 1023.98px) {
    .users-col-email, .users-col-password { display: none; }
  }
  @media (min-width: 1024px) and (max-width: 1279.98px) {
    .users-col-password { display: none; }
  }

  /* Events page — Apolo alerts-dashboard header + filter-bar */
  .events-page-header {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 0.25rem;
  }
  @media (min-width: 768px) {
