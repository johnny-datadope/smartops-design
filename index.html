<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Smart Ops</title>
<link rel="icon" href="Favicon_SmartOps_32x32.jpg" type="image/jpeg" sizes="32x32">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Datadope SmartOps — design variables (dark default) */
  :root {
    --background: oklch(0.18 0.04 231);
    --foreground: oklch(0.98 0 0);
    --card: oklch(0.22 0.03 231);
    --card-foreground: oklch(0.98 0 0);
    --popover: oklch(0.22 0.03 231);
    --popover-foreground: oklch(0.98 0 0);
    --muted: oklch(0.25 0.03 231);
    --muted-foreground: oklch(0.70 0 0);
    --border: oklch(0.28 0.03 231);
    --accent: oklch(0.32 0.05 237);
    --accent-foreground: oklch(0.98 0 0);
    --primary: oklch(0.65 0.13 237);
    --primary-foreground: oklch(0.18 0.04 231);
    /* Tailwind dark:bg-input/30 */
    --input-30: oklch(from var(--input) l c h / 0.3);
    --ring: oklch(0.65 0.13 237);
    --destructive: oklch(0.65 0.24 358);
    --destructive-foreground: oklch(0.98 0 0);
    --secondary: oklch(0.30 0.06 323);
    --secondary-foreground: oklch(0.98 0 0);
    --info: oklch(0.65 0.13 237);
    --warning: oklch(0.85 0.15 85);
    --input: oklch(0.28 0.03 231);
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);

    --datadope-purple: #b44ec4;
    --datadope-pink: #f25aaa;
    --datadope-magenta: #FF66FF;
    --datadope-blue: #3eaee0;
    --datadope-teal: #7dd4cf;

    /* Legacy aliases used by existing JSX */
    --bg: var(--background);
    --bg-2: var(--card);
    --bg-3: var(--muted);
    --bg-hover: oklch(0.26 0.03 231);
    --line: var(--border);
    --line-2: oklch(0.32 0.03 231);
    --fg: var(--foreground);
    --fg-2: oklch(0.78 0.008 231);
    --fg-3: var(--muted-foreground);
    --fg-4: oklch(0.48 0.010 231);
    --accent-2: var(--primary);
    --accent-glow: oklch(0.65 0.13 237 / 0.18);

    --sev-crit: var(--datadope-pink);
    --sev-high: var(--datadope-pink);
    --sev-med:  var(--datadope-purple);
    --sev-low:  var(--datadope-blue);
    --sev-info: var(--datadope-blue);
    --sev-ok:   var(--datadope-teal);

    --label-bg: oklch(0.32 0.06 330);
    --label-fg: oklch(0.85 0.10 330);
    --label-bd: oklch(0.45 0.09 330);

    --radius: 8px;
    --radius-sm: 6px;
    --radius-xs: 4px;

    /* Typography scale — Apolo @ 16px root (Tailwind v4) */
    --font-sans: 'Open Sans', system-ui, sans-serif;
    --font-mono: 'Roboto Mono', ui-monospace, monospace;
    --type-2xs: 8px;
    --type-xs: 10px;
    --type-2sm: 11px;
    --type-sm: 12px;
    --type-base: 13px;
    --type-md: 14px;
    --type-lg: 18px;
    --type-xl: 20px;
    --type-2xl: 24px;
    --type-3xl: 30px;
    --weight-normal: 400;
    --weight-medium: 500;
    --weight-semibold: 600;
    --weight-bold: 700;
    --leading-none: 1;
    --leading-tight: 1.25;
    --leading-relaxed: 1.625;
    --tracking-tight: -0.025em;
    --tracking-wider: 0.05em;

    color-scheme: dark;
  }
  [data-theme="light"] {
    color-scheme: light;
    --background: oklch(0.99 0 0);
    --foreground: oklch(0.13 0.04 231);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.13 0.04 231);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.13 0.04 231);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.55 0 0);
    --border: oklch(0.92 0 0);
    --accent: oklch(0.91 0.04 237);
    --primary: oklch(0.59 0.13 237);
    --primary-foreground: oklch(0.99 0 0);
    --ring: oklch(0.59 0.13 237);
    --destructive: oklch(0.60 0.24 358);
    --destructive-foreground: oklch(0.99 0 0);
    --secondary: oklch(0.96 0.01 323);
    --secondary-foreground: oklch(0.44 0.21 323);
    --info: oklch(0.59 0.13 237);
    --warning: oklch(0.80 0.15 85);
    --input: oklch(0.92 0 0);
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.05);

    --datadope-purple: #820091;
    --datadope-pink: #e51381;
    --datadope-magenta: #FF00FF;
    --datadope-blue: #0088C2;
    --datadope-teal: #72c4bf;

    --bg-hover: oklch(0.955 0.005 231);
    --line-2: oklch(0.82 0.008 231);
    --fg-2: oklch(0.38 0.012 231);
    --fg-4: oklch(0.68 0.012 231);
    --accent-glow: oklch(0.75 0.12 237 / 0.16);

    --label-bg: oklch(0.96 0.03 330);
    --label-fg: oklch(0.48 0.18 330);
    --label-bd: oklch(0.88 0.06 330);
  }
  html, body {
    margin:0; padding:0;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: var(--leading-relaxed);
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }

  /* Typography utilities — use tokens; avoid inline fontSize in JSX */
  .type-md { font-size: var(--type-md); }
  .type-md-semibold { font-size: var(--type-md); font-weight: var(--weight-semibold); }
  .type-sm { font-size: var(--type-sm); }
  .type-sm-medium { font-size: var(--type-sm); font-weight: var(--weight-medium); }
  .type-2sm { font-size: var(--type-2sm); }
  .type-2sm-medium { font-size: var(--type-2sm); font-weight: var(--weight-medium); }
  .type-2sm-medium-caps {
    font-size: var(--type-2sm); font-weight: var(--weight-medium);
    text-transform: uppercase; letter-spacing: var(--tracking-wider);
  }
  .type-base { font-size: var(--type-base); }
  .type-base-relaxed { font-size: var(--type-base); line-height: var(--leading-relaxed); }
  .type-lg-semibold { font-size: var(--type-lg); font-weight: var(--weight-semibold); }
  .type-xl-semibold { font-size: var(--type-xl); font-weight: var(--weight-semibold); }
  .type-2xl-bold { font-size: var(--type-2xl); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight); }
  .type-3xl-bold { font-size: var(--type-3xl); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight); }
  .text-muted { color: var(--muted-foreground); }

  /* ── Scrollbars (individual tiers — do not mix) ───────────────────────
     Events page vertical + table horizontal: native browser (Apolo has no CSS).
     Modal panels: Chia ScrollArea — w-2.5 / 10px, bg-border thumb (unchanged).
     JSON + reasoning pre: thin 6px variant. */

  /* Events table — Apolo ui/table overflow-x-auto only */
  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Modal — Chia ScrollArea: w-2.5 track transparent, rounded-full bg-border thumb */
  .alert-left-scroll,
  .chat-panel__scroll,
  .comment-composer__scroll-viewport {
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .alert-left-scroll::-webkit-scrollbar,
  .chat-panel__scroll::-webkit-scrollbar,
  .comment-composer__scroll-viewport::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  .alert-left-scroll::-webkit-scrollbar-track,
  .chat-panel__scroll::-webkit-scrollbar-track,
  .comment-composer__scroll-viewport::-webkit-scrollbar-track {
    background: transparent;
  }
  .alert-left-scroll::-webkit-scrollbar-thumb,
  .chat-panel__scroll::-webkit-scrollbar-thumb,
  .comment-composer__scroll-viewport::-webkit-scrollbar-thumb {
    background-color: var(--border);
    border-radius: 9999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  .alert-left-scroll::-webkit-scrollbar-thumb:hover,
  .chat-panel__scroll::-webkit-scrollbar-thumb:hover,
  .comment-composer__scroll-viewport::-webkit-scrollbar-thumb:hover {
    background-color: color-mix(in oklch, var(--border) 80%, var(--muted-foreground));
  }
  .alert-left-scroll::-webkit-scrollbar-corner,
  .chat-panel__scroll::-webkit-scrollbar-corner,
  .comment-composer__scroll-viewport::-webkit-scrollbar-corner {
    background: transparent;
  }
  /* Apolo Radix ScrollArea: no native up/down arrow buttons */
  .alert-left-scroll::-webkit-scrollbar-button,
  .chat-panel__scroll::-webkit-scrollbar-button,
  .comment-composer__scroll-viewport::-webkit-scrollbar-button {
    display: none;
    width: 0;
    height: 0;
  }

  /* Thin variant — Chia reasoning code blocks + JSON payload (w-1.5, bg-border/70) */
  .scrollbar-thin,
  .json-payload-card__body,
  .reasoning-tool__output {
    scrollbar-width: thin;
    scrollbar-color: color-mix(in oklch, var(--border) 70%, transparent) transparent;
  }
  .scrollbar-thin::-webkit-scrollbar,
  .json-payload-card__body::-webkit-scrollbar,
  .reasoning-tool__output::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  .scrollbar-thin::-webkit-scrollbar-thumb,
  .json-payload-card__body::-webkit-scrollbar-thumb,
  .reasoning-tool__output::-webkit-scrollbar-thumb {
    background-color: color-mix(in oklch, var(--border) 70%, transparent);
    border-radius: 9999px;
    border: 0;
    background-clip: padding-box;
  }
  .scrollbar-thin::-webkit-scrollbar-button,
  .json-payload-card__body::-webkit-scrollbar-button,
  .reasoning-tool__output::-webkit-scrollbar-button {
    display: none;
    width: 0;
    height: 0;
  }
  button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; font-size: inherit; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  button:not(:disabled) { cursor: pointer !important; }
  input, textarea { font-family: inherit; color: inherit; }
  .mono { font-family: var(--font-mono); }
  #root { min-height: 100vh; }

  /* Layout (Apolo-aligned) */
  .layout-page {
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    padding: 1.5rem 1rem 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.125rem;
  }
  @media (min-width: 768px) {
    .layout-page { padding: 2rem 1.5rem 2.5rem; }
  }
  /* Usage & Costs — Apolo usage-cost-reports-page (flex flex-col gap-6) */
  .layout-page--usage { gap: 1.5rem; }
  .layout-header {
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 1px solid var(--border);
    background: color-mix(in oklch, var(--background) 95%, transparent);
    backdrop-filter: blur(8px);
  }
  .layout-header-inner {
    box-sizing: border-box;
    display: flex;
    width: 100%;
    min-width: 0;
    min-height: 3.5rem;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding-inline: 1rem;
  }
  @media (min-width: 768px) {
    .layout-header-inner { min-height: 4rem; padding-inline: 1.5rem; }
    .layout-header-inner .header-logo { height: 2.5rem; }
  }
  .header-logo { height: 2rem; width: auto; display: block; flex-shrink: 0; }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 1rem;
    min-width: 0;
  }
  .header-nav-divider {
    display: none;
    width: 1px;
    height: 1.375rem;
    background: var(--border);
    flex-shrink: 0;
  }
  .header-nav {
    display: none;
    align-items: center;
    gap: 0.25rem;
    flex-wrap: wrap;
  }
  @media (min-width: 768px) {
    .header-nav-divider { display: block; }
    .header-nav { display: flex; }
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.375rem;
    flex-shrink: 0;
  }
  @media (min-width: 768px) { .header-actions { gap: 0.5rem; } }
  /* Desktop only — Apolo UserMenu: hidden md:inline-flex */
  .header-actions .user-menu-desktop { display: none; }
  @media (min-width: 768px) {
    .header-actions .user-menu-desktop { display: block; }
  }
  .user-menu-trigger__text {
    display: none;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.25;
    min-width: 0;
  }
  @media (min-width: 768px) { .user-menu-trigger__text { display: flex; } }
  .user-menu-trigger__chevron {
    display: none;
    flex-shrink: 0;
    color: var(--muted-foreground);
  }
  @media (min-width: 768px) { .user-menu-trigger__chevron { display: block; } }
  /* Mobile nav drawer — Apolo Sheet (full width < sm, 340px ≥ sm) */
  .mobile-nav-backdrop {
    position: fixed;
    inset: 0;
    z-index: 45;
    background: rgb(0 0 0 / 0.5);
  }
  .mobile-nav-sheet {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 46;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: none;
    height: 100dvh;
    background: var(--background);
    border-left: 1px solid var(--border);
    box-shadow: -8px 0 24px rgba(0, 0, 0, 0.25);
    animation: slideIn 0.22s ease;
  }
  @media (min-width: 640px) {
    .mobile-nav-sheet { width: 340px; max-width: 24rem; }
  }
  .mobile-nav-sheet__header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .mobile-nav-sheet__identity { flex: 1; min-width: 0; }
  .mobile-nav-sheet__close { flex-shrink: 0; }
  .mobile-nav-sheet__body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 1rem;
    padding-bottom: calc(1rem + env(safe-area-inset-bottom));
  }
  .mobile-nav-sheet__nav {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .mobile-nav-link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    min-height: 2.75rem;
    padding: 0 0.75rem;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--foreground);
    font-size: 0.875rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
  }
  .mobile-nav-link:hover { background: var(--accent); color: var(--accent-foreground); }
  .mobile-nav-link.is-active { background: var(--accent); color: var(--accent-foreground); }
  .mobile-nav-divider {
    height: 1px;
    background: var(--border);
    margin: 1rem 0;
  }
  .mobile-nav-prefs { display: flex; flex-direction: column; gap: 1rem; }
  .mobile-nav-prefs__label {
    margin-bottom: 0.5rem;
    font-size: 0.875rem;
    color: var(--foreground);
  }
  .mobile-nav-prefs__chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .mobile-nav-account-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    min-height: 2.75rem;
    padding: 0 0.75rem;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--foreground);
    font-size: 0.875rem;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
  }
  .mobile-nav-account-item:hover { background: var(--accent); color: var(--accent-foreground); }
  .mobile-nav-account-item--danger { color: var(--destructive); }
  .mobile-nav-account-item--danger:hover { color: var(--destructive); }
  .user-identity-card {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    min-width: 0;
  }
  .user-identity-card__avatar {
    width: 2.5rem;
    height: 2.5rem;
    font-size: 0.875rem;
  }
  .user-identity-card__text { min-width: 0; text-align: left; }
  .user-identity-card__name {
    font-size: 0.875rem;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .user-identity-card__email {
    font-size: 0.75rem;
    color: var(--muted-foreground);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .logout-dialog-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: rgb(0 0 0 / 0.5);
  }
  .logout-dialog {
    width: 100%;
    max-width: 380px;
    padding: 1.375rem 1.5rem;
    box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.45);
  }
  .logout-dialog__title { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
  .logout-dialog__desc { font-size: 0.8125rem; color: var(--muted-foreground); margin-bottom: 1.25rem; }
  .logout-dialog__actions { display: flex; justify-content: flex-end; gap: 0.5rem; }

  /* Card */
  .card {
    background: var(--card);
    color: var(--foreground);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    box-shadow: var(--shadow-xs);
  }

  /* Input */
  .input {
    display: block;
    width: 100%;
    height: 2.25rem;
    padding: 0.25rem 0.75rem;
    font-size: 0.875rem;
    line-height: 1.25rem;
    color: var(--foreground);
    background: transparent;
    border: 1px solid var(--input);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-xs);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  [data-theme="dark"] .input { background: color-mix(in oklch, var(--input) 30%, transparent); }
  .input:focus {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
  }
  .input-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex: 1;
    padding: 0 0.75rem;
    height: 2.25rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card);
    box-shadow: var(--shadow-xs);
  }
  .input-wrap:focus-within {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
  }
  .input-wrap .input {
    border: 0;
    box-shadow: none;
    height: 100%;
    padding: 0;
    background: transparent;
  }
  .input-wrap .input:focus { box-shadow: none; }

  /* Form select — Chia/Apolo Select (SelectTrigger + SelectContent + SelectItem) */
  .form-select { position: relative; width: 100%; }
  .form-select__trigger {
    box-sizing: border-box;
    width: 100%;
    min-height: 2.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--input, var(--border));
    background: transparent;
    color: var(--foreground);
    font-size: 0.875rem;
    font-weight: 400;
    font-family: inherit;
    line-height: 1.25rem;
    cursor: pointer;
    text-align: left;
    box-shadow: var(--shadow-xs);
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  [data-theme="dark"] .form-select__trigger {
    background: color-mix(in oklch, var(--input) 30%, transparent);
  }
  [data-theme="dark"] .form-select__trigger:hover {
    background: color-mix(in oklch, var(--input) 50%, transparent);
  }
  .form-select__trigger:focus-visible {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
    outline: none;
  }
  .form-select__trigger span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .form-select__chevron { flex-shrink: 0; opacity: 0.5; color: var(--muted-foreground); }
  .form-select__content {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 60;
    padding: 0.25rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--popover);
    color: var(--popover-foreground);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -4px rgba(0, 0, 0, 0.15);
    max-height: var(--radix-select-content-available-height, 15rem);
    overflow-x: hidden;
    overflow-y: auto;
  }
  .form-select__item {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    min-height: 2rem;
    padding: 0.375rem 2rem 0.375rem 0.5rem;
    border: 0;
    border-radius: calc(var(--radius-sm) - 2px);
    font-size: 0.875rem;
    font-family: inherit;
    line-height: 1.25rem;
    color: var(--popover-foreground);
    background: transparent;
    cursor: default;
    text-align: left;
    transition: background 0.15s, color 0.15s;
  }
  .form-select__item:hover,
  .form-select__item:focus-visible {
    background: var(--accent);
    color: var(--accent-foreground);
    outline: none;
  }
  .form-select__check {
    position: absolute;
    right: 0.5rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1rem;
    height: 1rem;
    pointer-events: none;
  }
  .form-select__item.is-selected {
    background: var(--accent);
    color: var(--accent-foreground);
  }
  /* Compact select — Apolo TablePagination (h-6 w-14, opens upward) */
  .form-select--compact { width: auto; }
  .form-select--compact .form-select__trigger {
    width: 3.5rem;
    min-height: 1.5rem;
    height: 1.5rem;
    padding: 0 0.5rem;
    font-size: 0.6875rem;
    line-height: 1;
    border-color: color-mix(in oklch, var(--border) 40%, transparent);
    box-shadow: none;
  }
  .form-select--compact .form-select__trigger:focus-visible {
    box-shadow: 0 0 0 2px color-mix(in oklch, var(--ring) 50%, transparent);
  }
  .form-select--compact .form-select__content {
    min-width: 3.5rem;
    padding: 0.25rem;
  }
  .form-select__content--align-end { left: auto; right: 0; }
  .form-select__content--top {
    top: auto;
    bottom: calc(100% + 4px);
  }
  .form-select--compact .form-select__item {
    min-height: 1.75rem;
    padding: 0.25rem 0.5rem;
    font-size: 0.6875rem;
    justify-content: center;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    height: 2.25rem;
    padding: 0 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 1;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn--primary {
    background: var(--primary);
    color: var(--primary-foreground);
    border-color: var(--primary);
  }
  .btn--primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn--outline {
    background: var(--background);
    color: var(--foreground);
    border-color: var(--border);
    box-shadow: var(--shadow-xs);
  }
  .btn--outline:hover:not(:disabled) { background: var(--accent); }
  .btn--ghost {
    background: transparent;
    color: var(--fg-2);
    border-color: transparent;
  }
  .btn--ghost:hover:not(:disabled), .btn--ghost.is-active {
    background: var(--accent);
    color: var(--accent-foreground);
  }
  .btn--sm { height: 2rem; padding: 0 0.75rem; font-size: 0.8125rem; }
  .btn--icon { width: 2rem; height: 2rem; padding: 0; }

  /* Header responsive — after .btn so display wins (Apolo md:hidden / md:inline-flex) */
  .header-actions .header-menu-btn.btn {
    display: inline-flex;
  }
  @media (min-width: 768px) {
    .header-actions .header-menu-btn.btn { display: none; }
  }

  .btn:disabled {
    opacity: 0.5;
    pointer-events: none;
    cursor: not-allowed;
  }

  /* Badges (Apolo / shadcn-style) */
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.375rem;
    padding: 0.125rem 0.5rem;
    font-size: 0.75rem;
    font-weight: 500;
    line-height: 1.25;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .badge--destructive {
    background: var(--destructive);
    color: var(--destructive-foreground);
    border-color: transparent;
  }
  .badge--primary-solid {
    background: var(--primary);
    color: var(--primary-foreground);
    border-color: transparent;
  }
  .badge--purple-solid {
    background: var(--datadope-purple);
    color: #fff;
    border-color: transparent;
  }
  .badge--secondary {
    background: var(--secondary);
    color: var(--secondary-foreground);
    border-color: transparent;
  }
  .badge--outline { border-color: var(--border); color: var(--foreground); background: transparent; }
  .badge--muted {
    background: var(--muted);
    color: var(--muted-foreground);
    border-color: var(--border);
  }
  .badge--dd-pink {
    background: color-mix(in srgb, var(--datadope-pink) 15%, transparent);
    color: var(--datadope-pink);
    border-color: color-mix(in srgb, var(--datadope-pink) 30%, transparent);
  }
  .badge--dd-purple {
    background: color-mix(in srgb, var(--datadope-purple) 15%, transparent);
    color: var(--datadope-purple);
    border-color: color-mix(in srgb, var(--datadope-purple) 30%, transparent);
  }
  .badge--dd-blue {
    background: color-mix(in srgb, var(--datadope-blue) 15%, transparent);
    color: var(--datadope-blue);
    border-color: color-mix(in srgb, var(--datadope-blue) 30%, transparent);
  }
  .badge--dd-teal {
    background: color-mix(in srgb, var(--datadope-teal) 15%, transparent);
    color: var(--datadope-teal);
    border-color: color-mix(in srgb, var(--datadope-teal) 30%, transparent);
  }
  .badge--warning-tint {
    background: color-mix(in srgb, var(--warning) 15%, transparent);
    color: var(--warning);
    border-color: color-mix(in srgb, var(--warning) 30%, transparent);
  }
  .badge--destructive-outline {
    background: color-mix(in srgb, var(--destructive) 10%, transparent);
    color: var(--destructive);
    border-color: color-mix(in srgb, var(--destructive) 20%, transparent);
  }
  /* Apolo admin tints (literal palette to match chia exactly) */
  .badge--pill { border-radius: 9999px; }
  .badge--primary-tint {
    background: color-mix(in oklch, var(--primary) 10%, transparent);
    color: var(--primary);
    border-color: color-mix(in oklch, var(--primary) 40%, transparent);
  }
  .badge--amber-tint {
    background: color-mix(in srgb, #f59e0b 10%, transparent);
    color: #fbbf24; /* amber-400 (dark default) */
    border-color: color-mix(in srgb, #f59e0b 40%, transparent);
  }
  [data-theme="light"] .badge--amber-tint { color: #d97706; } /* amber-600 */
  .badge--emerald-tint {
    background: color-mix(in srgb, #10b981 10%, transparent);
    color: #10b981; /* emerald-500 */
    border-color: color-mix(in srgb, #10b981 40%, transparent);
  }

  /* KPI grid — Chia alert-stats: grid-cols-1 sm:2 md:4, gap-2 sm:gap-3 md:gap-4 */
  .stat-cards-grid {
    display: grid;
    grid-template-columns: repeat(1, minmax(0, 1fr));
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  @media (min-width: 640px) {
    .stat-cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
  }
  @media (min-width: 768px) {
    .stat-cards-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
  }
  /* Chia CardContent: px-3 py-2.5 sm:p-4 md:p-6 — height from content only */
  .stat-card {
    cursor: pointer; padding: 0; text-align: left; width: 100%;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .stat-card__content {
    padding: 0.625rem 0.75rem;
  }
  @media (min-width: 640px) {
    .stat-card__content { padding: 1rem; }
  }
  @media (min-width: 768px) {
    .stat-card__content { padding: 1.5rem; }
  }
  .stat-card__row {
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
  }
  /* Chia: flex items-center gap-3 sm:block — mobile: value+label in row; sm+: stacked in DOM order */
  .stat-card__text {
    min-width: 0;
    display: flex; align-items: center; gap: 0.75rem;
  }
  @media (min-width: 640px) {
    .stat-card__text { display: block; }
    .stat-card__label { margin-bottom: 0.25rem; }
  }
  .stat-card__value {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.1;
    color: var(--foreground);
  }
  @media (min-width: 768px) {
    .stat-card__value { font-size: 1.875rem; }
  }
  .stat-card__label {
    margin: 0;
    font-size: 0.75rem;
    line-height: 1.25;
    color: var(--muted-foreground);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  @media (min-width: 768px) {
    .stat-card__label { font-size: 0.875rem; }
  }
  .stat-card:hover {
    transform: scale(1.02);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
  }
  /* Event detail modal — fixed header (Chia alert-left-panel) */
  .modal-left-fixed {
    flex-shrink: 0;
    display: flex; flex-direction: column; gap: 0.75rem;
    padding: 0.75rem 0.75rem 0;
  }
  .modal-alert-header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
  }
  .modal-alert-header__main { flex: 1; min-width: 0; }
  .modal-alert-header__badges { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .modal-alert-header__title {
    margin: 0;
    font-size: 1.125rem;
    font-weight: 700;
    letter-spacing: -0.025em;
    text-wrap: balance;
    color: var(--foreground);
  }
  .modal-alert-header__meta {
    margin: 0.25rem 0 0;
    font-size: 11px;
    line-height: 1.25;
    color: var(--muted-foreground);
  }
  .modal-alert-header__meta-sep { margin: 0 0.25rem; opacity: 0.4; }
  .modal-alert-header--mobile-toolbar {
    flex-direction: column;
    align-items: stretch;
    gap: 0;
  }
  .modal-alert-header--mobile-toolbar .modal-alert-header__main {
    width: 100%;
  }
  .modal-alert-header__badges-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }
  .modal-alert-header__badges-row .modal-alert-header__badges {
    margin-bottom: 0;
    flex: 1;
    min-width: 0;
  }
  .modal-alert-header__badges-row .modal-alert-header__toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-shrink: 0;
  }
  /* Modal chrome — case status + actions, then maximize + close (SO-2173 AC4) */
  .modal-chrome-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
    z-index: 30;
    pointer-events: auto;
  }
  .case-mgmt__top-aside .modal-chrome-actions__btn,
  .modal-alert-header__toolbar .modal-chrome-actions__btn {
    width: 1.75rem;
    height: 1.75rem;
  }
  .modal-dialog--split > .modal-chrome-bar {
    position: absolute;
    top: 1.25rem;
    right: 1.25rem;
  }
  .modal-chrome-case {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: nowrap;
  }
  .modal-chrome-no-case {
    font-size: 11px;
    line-height: 1.25;
    color: var(--muted-foreground);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .modal-chrome-actions {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    flex-shrink: 0;
  }
  .modal-chrome-actions__btn {
    width: 2rem;
    height: 2rem;
    padding: 0;
    border: 0;
    border-radius: 0.375rem;
    background: transparent;
    color: var(--muted-foreground);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }
  .modal-chrome-actions__btn:hover:not(:disabled) {
    background: var(--secondary);
    color: var(--foreground);
  }
  .modal-detail-tabs {
    display: flex; margin: 0 -0.75rem; padding: 0 0.75rem;
    border-bottom: 1px solid var(--border);
  }
  .detail-tab {
    position: relative; flex: 1; text-align: center;
    padding: 0.5rem 0.75rem; font-size: 0.75rem; font-weight: 500;
    color: var(--muted-foreground); background: transparent; border: 0;
    cursor: pointer; transition: color 0.15s;
  }
  .detail-tab:hover { color: var(--foreground); }
  .detail-tab.is-active { color: var(--primary); }
  .detail-tab.is-active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0;
    height: 2px; background: var(--primary); border-radius: 9999px;
  }
  .detail-tab__short { display: inline; }
  .detail-tab__long { display: none; }
  /* Overview description card — Chia overview-description-card.tsx */
  .overview-card { padding: 1rem; }
  .overview-card__head {
    display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;
  }
  .overview-card__head-icon {
    width: 1.5rem; height: 1.5rem; border-radius: 0.375rem; flex-shrink: 0;
    background: color-mix(in oklch, var(--primary) 15%, transparent);
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
  }
  .overview-card__head-title {
    margin: 0; font-size: 0.875rem; font-weight: 600; color: var(--foreground);
  }
  .overview-card__body {
    margin-left: 2rem; display: flex; flex-direction: column; gap: 0.75rem;
  }
  .overview-body {
    margin: 0; font-size: 0.875rem; line-height: 1.625; color: var(--foreground);
  }
  .overview-label {
    font-size: 11px; font-weight: 500; color: var(--muted-foreground);
    text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.25rem;
  }
  .overview-label--labels { margin-bottom: 0.5rem; }
  .overview-divider { height: 1px; background: var(--border); border: 0; margin: 0; }
  .overview-labels { display: flex; gap: 0.375rem; flex-wrap: wrap; }

  /* Empty case — empty-case-state.tsx */
  .empty-case-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1.5rem; text-align: center; min-height: 300px;
  }
  .empty-case-state__icon {
    width: 4rem; height: 4rem; border-radius: 9999px; margin-bottom: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .empty-case-state__icon.is-assigned {
    background: color-mix(in oklch, var(--primary) 10%, transparent);
    border: 2px solid color-mix(in oklch, var(--primary) 20%, transparent);
    color: var(--primary);
  }
  .empty-case-state__icon.is-unassigned {
    background: var(--muted);
    border: 2px solid color-mix(in oklch, var(--muted-foreground) 20%, transparent);
    color: var(--muted-foreground);
  }
  .empty-case-state__title {
    font-size: var(--type-lg); font-weight: var(--weight-semibold); margin: 0 0 0.375rem;
  }
  .empty-case-state__desc {
    font-size: var(--type-md); color: var(--muted-foreground); line-height: var(--leading-relaxed);
    max-width: 280px; margin: 0 0 1.25rem;
  }

  /* Login — login-form.tsx */
  .login-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--background); padding: 1.5rem;
  }
  .login-card { width: 100%; max-width: 24rem; padding: 1.5rem 1.75rem; }
  .login-card__logo { display: flex; justify-content: center; margin-bottom: 1rem; }
  .login-card__intro { text-align: center; margin-bottom: 1.125rem; }
  .login-card__title {
    font-size: var(--type-xl); font-weight: var(--weight-semibold); margin: 0;
  }
  @media (min-width: 768px) {
    .login-card__title { font-size: var(--type-2xl); }
  }
  .login-card__subtitle {
    font-size: var(--type-md); color: var(--muted-foreground); margin-top: 0.25rem;
  }
  .login-field { margin-bottom: 0.625rem; }
  .login-field__label {
    font-size: var(--type-md); font-weight: var(--weight-medium); margin-bottom: 0.3125rem;
  }
  .login-divider {
    display: flex; align-items: center; gap: 0.625rem; margin: 1.125rem 0 0.875rem;
  }
  .login-divider__line { flex: 1; height: 1px; background: var(--border); }
  .login-divider__text {
    font-size: var(--type-2sm); color: var(--muted-foreground); text-transform: uppercase;
  }
  .login-google__text { flex: 1; text-align: left; font-size: var(--type-md); }

  /* App shell */
  .app-toast__title {
    font-size: var(--type-md); font-weight: var(--weight-semibold);
    margin-bottom: 0.25rem;
  }
  .app-toast__title--solo { margin-bottom: 0; }
  .app-toast__desc { font-size: var(--type-base); color: var(--muted-foreground); line-height: 1.4; }
  .app-footer-text { font-size: var(--type-2sm); color: var(--muted-foreground); text-align: center; }
  .app-footer {
    padding: 0.625rem 1.5rem; border-top: 1px solid var(--border);
  }

  /* Confirm create case dialog */
  .confirm-dialog__title {
    font-size: var(--type-lg); font-weight: var(--weight-semibold); margin: 0 0 0.5rem;
  }
  .confirm-dialog__desc {
    font-size: var(--type-md); color: var(--muted-foreground);
    line-height: var(--leading-relaxed); margin: 0 0 1.25rem;
  }

  /* Events table / filters */
  .events-table { width: 100%; border-collapse: collapse; font-size: var(--type-md); }
  .events-active-filters-label { font-size: var(--type-md); color: var(--muted-foreground); }
  .events-assignee-name {
    font-size: var(--type-md); color: var(--muted-foreground);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;
  }
  .events-popover-hint {
    font-size: var(--type-sm); color: var(--muted-foreground); margin: 0; padding: 0.25rem;
  }
  .events-table-empty {
    padding: 3rem 1.5rem; text-align: center; color: var(--muted-foreground);
    font-size: var(--type-md);
  }
  .events-menu-item {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 6px;
    font-size: var(--type-sm); color: var(--foreground);
    background: transparent; border: 0; cursor: pointer; text-align: left;
    font-family: inherit;
  }

  /* Admin sidebar label */
  .admin-sidebar-label {
    font-size: var(--type-sm); font-weight: var(--weight-semibold);
    text-transform: uppercase; letter-spacing: var(--tracking-wider);
    color: var(--muted-foreground); margin: 0;
  }

  /* Users admin extensions */
  .users-table { width: 100%; border-collapse: collapse; font-size: var(--type-md); }
  .users-table__name { font-weight: var(--weight-medium); font-size: var(--type-md); }
  .users-table-mobile-meta,
  .users-table-mobile-email { display: none; font-size: var(--type-2sm); color: var(--muted-foreground); }
  .users-col-username {
    padding: 12px 16px; font-family: var(--font-mono);
    font-size: var(--type-sm); color: var(--muted-foreground);
  }
  .users-col-email {
    padding: 12px 16px; font-size: var(--type-md); color: var(--muted-foreground);
  }
  .users-stat-label {
    margin-top: 0.5rem; font-size: var(--type-xs);
    text-transform: uppercase; letter-spacing: 0.025em; color: var(--muted-foreground);
  }
  @media (min-width: 640px) {
    .users-stat-label { font-size: var(--type-sm); }
  }
  .users-form-row-label { font-size: var(--type-md); font-weight: var(--weight-medium); }
  .users-form-row-hint { font-size: var(--type-2sm); color: var(--muted-foreground); margin-top: 2px; }
  .users-form-optional {
    margin-left: 0.25rem; font-size: var(--type-2sm);
    font-weight: var(--weight-normal); color: var(--muted-foreground);
  }
  .users-modal-heading { font-size: 15px; font-weight: var(--weight-semibold); }
  .users-modal-sub { font-size: var(--type-sm); color: var(--fg-3); margin-top: 3px; }
  .users-field-label {
    font-size: 11.5px; font-weight: var(--weight-medium); color: var(--fg-2); margin-bottom: 5px;
  }
  .users-field-error { font-size: var(--type-2sm); color: var(--sev-crit); margin-top: 5px; }
  .users-search-input { color: var(--fg); font-size: var(--type-md); font-weight: var(--weight-medium); }
  .users-provider-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px 2px 6px; border-radius: 9999px;
    font-size: var(--type-sm); font-weight: var(--weight-medium); line-height: var(--leading-tight);
  }
  .users-provider-badge--small { font-size: var(--type-xs); padding-top: 0; padding-bottom: 0; }
  .users-table th {
    text-align: left; font-weight: var(--weight-medium); font-size: var(--type-sm);
    padding: 12px 16px; color: var(--muted-foreground); white-space: nowrap;
  }
  .users-table-status-empty {
    padding: 2.5rem; text-align: center; color: var(--muted-foreground);
  }
  .users-form-sso-notice {
    display: flex; align-items: flex-start; gap: 8px; margin-bottom: 14px;
    padding: 12px; border-radius: 8px; border: 1px solid var(--border);
    background: color-mix(in oklch, var(--muted) 40%, transparent);
    font-size: var(--type-md); color: var(--muted-foreground);
  }
  .users-toast {
    position: fixed; bottom: 20px; right: 20px; z-index: 60;
    padding: 11px 16px; border-radius: 10px;
    background: color-mix(in oklch, var(--sev-ok) 18%, var(--bg-2));
    border: 1px solid color-mix(in oklch, var(--sev-ok) 45%, var(--line-2));
    color: var(--fg); font-size: var(--type-md); font-weight: var(--weight-medium);
    display: flex; align-items: center; gap: 9px;
    box-shadow: 0 20px 40px -14px rgba(0,0,0,0.5);
  }
  .users-input {
    width: 100%; padding: 9px 11px; border-radius: 7px;
    background: var(--bg); border: 1px solid var(--line-2);

  /* Advanced filters panel (Chia FilterPopover) */
  .filter-panel-backdrop { position: fixed; inset: 0; z-index: 30; }
  .filter-panel {

  }
  .filter-select-btn:hover { background: var(--accent); color: var(--accent-foreground); }
  .filter-select-btn.is-placeholder { color: var(--foreground); font-weight: 400; }
  .filter-select-btn.is-placeholder.is-muted { color: var(--muted-foreground); }
  .filter-select-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .filter-select-menu {

    width: 14rem; min-width: 14rem;
    max-height: 15rem; overflow-y: auto;
    padding: 0.5rem;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);

  .filter-check-row {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0; border-radius: var(--radius-sm);
    font-size: 0.875rem; cursor: pointer;
    color: var(--foreground);
    outline: none;
  }
  .filter-check-row:hover { color: var(--foreground); }
  .filter-check-row:hover .filter-check-box:not(.is-checked),
  .filter-check-row:focus-visible .filter-check-box {
    border-color: var(--ring);
  }
  .filter-check-row:focus-visible .filter-check-box {
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
  }
  .filter-check-box {
    width: 1rem; height: 1rem; border-radius: 4px; flex-shrink: 0;
    border: 1px solid var(--input, var(--border));

  .filter-input {

  .filter-date-range { display: flex; flex-direction: column; gap: 0.75rem; }
  .filter-date-field { display: flex; flex-direction: column; gap: 0.25rem; }
  .filter-date-sub { font-size: 0.75rem; color: var(--muted-foreground); display: block; }
  .filter-date-btn {
    box-sizing: border-box;
    width: 100%; min-height: 2rem;

    border: 1px solid var(--input, var(--border));
    background: transparent;
    color: var(--foreground);

  }
  .filter-date-btn.is-empty { color: var(--muted-foreground); }
  .filter-date-btn.is-open,
  .filter-date-btn:focus-visible {

  .filter-date-btn span { flex: 1; text-align: left; }
  .filter-calendar-popover {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 50;

  .filter-calendar__weekdays {
    display: grid; grid-template-columns: repeat(7, 2rem);
    gap: 0; margin-bottom: 0.25rem;
  }
  .filter-calendar__weekday {
    width: 2rem; height: 2rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 400; color: var(--muted-foreground);
  }
  .filter-calendar__grid {
    display: grid; grid-template-columns: repeat(7, 2rem);
    gap: 0;
  }
  .filter-calendar__day {
    width: 2rem; height: 2rem; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 0; border-radius: var(--radius-sm);

  .filter-calendar__day.is-selected {
    background: var(--primary); color: var(--primary-foreground);
  }
  .filter-calendar__day.is-selected:hover { filter: brightness(1.05); }
  .filter-calendar__day:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Rounded count badge used in dashboard toolbar buttons (Chia Badge rounded-full) */
  .count-badge {
    display: inline-flex; align-items: center; justify-content: center;
    height: 1.25rem; min-width: 1.25rem; padding: 0 0.375rem; margin-left: 0.125rem;

  .avatar-stack { display: flex; align-items: center; }

    display: flex; align-items: center; justify-content: center;

    background: color-mix(in oklch, var(--primary) 10%, transparent);
    color: var(--primary); border: 2px solid var(--card); margin-left: -0.5rem;

  .avatar:first-child { margin-left: 0; }
  /* Chia alerts-table-row: unassigned assignee trigger */
  .unassigned-assignee {
    display: flex; align-items: center; gap: 0.5rem;
    color: var(--muted-foreground);
    transition: color 0.15s;
  }

  .table-pagination {
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    padding: 0.375rem 0.75rem;
    border-top: 1px solid color-mix(in oklch, var(--border) 40%, transparent);
    font-size: 0.6875rem; color: var(--muted-foreground);

  .modal-overlay {

  }
  /* Full-page alert detail — above layout-header (z-50); mirrors chia alert-detail-modal */
  .modal-fullscreen {

    flex-direction: column;

    max-height: none;
    border-radius: 0;
    border: 0;
    box-shadow: none;

    max-height: calc(100dvh - 2rem);

    height: 100dvh;

  .modal-split__left,

  .modal-split__panel {

    flex-direction: column;
    flex: 1;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
  }
  .modal-split__left {
    min-width: 0;
    overflow: hidden;
    position: relative;
  }
  .modal-split__left.is-collapsed {
    overflow: hidden;
  }
  .modal-split__left-body {
